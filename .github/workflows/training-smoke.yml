name: Training smoke test

on:
  workflow_dispatch:
  push:
    paths:
      - "src/lxyra/training/**"
      - "tests/test_training.py"
      - ".github/workflows/training-smoke.yml"

permissions:
  contents: read

jobs:
  training:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -e ".[train,dev]"
      - run: python -m pytest -q tests/test_training.py
